<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
</head>

<body>

    <form action="#" method="get">

        <p>
            <label for="text">Текст:</label>
            <input type="text" name="Enter text" id="text">

            <label for="number">Число:</label>
            <input type="number" name="Enter number" id="number">

            <label for="email">Email:</label>
            <input type="email" name="Enter email" id="email">

            <label for="password">Пароль:</label>
            <input type="password" name="Enter password" id="password">
        </p>

        <p>
            <label for="date">Дата:</label>
            <input type="date" name="date" id="date">

            <label for="time">Время:</label>
            <input type="time" name="time" id="time">

            <label for="color">Цвет:</label>
            <input type="color" name="color" id="color">

            <label for="file">Файл:</label>
            <input type="file" name="file" id="file">
        </p>

        <p>
            <input type="checkbox" name="agree" id="agree">
            <label for="agree">Согласен с правилами</label>
        </p>

        <p>Выберите вариант:</p>
        <p>
            <input type="radio" name="choice" id="choice1" value="1">
            <label for="choice1">Вариант 1</label>

            <input type="radio" name="choice" id="choice2" value="2">
            <label for="choice2">Вариант 2</label>

            <input type="radio" name="choice" id="choice3" value="3">
            <label for="choice3">Вариант 3</label>
        </p>

        <p>
            <label for="city">Город:</label>
            <select name="city" id="city">
                <option value="msk">Москва</option>
                <option value="spb">Санкт-Петербург</option>
                <option value="kaz">Казань</option>
            </select>
        </p>

        <p>
            <input type="submit" value="Отправить">
            <input type="reset" value="Сбросить">
        </p>

    </form>

</body>

</html>
